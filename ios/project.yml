name: Hebdo
options:
  bundleIdPrefix: app.hebdo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: LRU8S47CXH
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.8.1"
    CURRENT_PROJECT_VERSION: "6"
targets:
  Hebdo:
    type: application
    platform: iOS
    sources:
      - path: Hebdo/Sources
      - path: Hebdo/Assets.xcassets
      - path: Hebdo/Resources/sketch.html
        buildPhase: resources
      - path: ../ui/sketch
        type: folder
        buildPhase: resources
    info:
      path: Hebdo/Info.plist
      properties:
        CFBundleDisplayName: Hebdo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        ITSAppUsesNonExemptEncryption: false
        NSUbiquitousContainers:
          iCloud.app.hebdo:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Hebdo
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Hebdo/Hebdo.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.hebdo
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.app.hebdo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hebdo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
