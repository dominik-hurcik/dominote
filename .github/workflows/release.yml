# Builds a signed, notarized universal macOS app (Apple Silicon + Intel)
# and publishes it when a version tag is pushed.
# Release: git tag v0.9.0 && git push origin v0.9.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: |
          node tests/md.test.js
          node tests/view.test.js
          node tests/cal.test.js
          cargo test

      - name: Build
        env:
          CI: true
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx -y @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg

      - name: Package
        working-directory: target/universal-apple-darwin/release/bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          ditto -c -k --keepParent macos/Hebdo.app "$GITHUB_WORKSPACE/out/Hebdo.app.zip"
          cp dmg/*.dmg "$GITHUB_WORKSPACE/out/Hebdo.dmg"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Hebdo $GITHUB_REF_NAME" --generate-notes out/*
