# Builds Dominote for macOS (universal: Apple Silicon + Intel) and Windows (x64),
# and publishes both when a version tag is pushed.
# Release: git tag v0.1.0 && git push origin v0.1.0
# Run it by hand from the Actions tab to test both builds without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: |
          node tests/md.test.js
          node tests/view.test.js
          cargo test

      - name: Build
        env:
          CI: true
        run: npx -y @tauri-apps/cli@2 build --target universal-apple-darwin --bundles app,dmg

      - name: Package
        working-directory: target/universal-apple-darwin/release/bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          ditto -c -k --keepParent macos/Dominote.app "$GITHUB_WORKSPACE/out/Dominote.app.zip"
          cp dmg/*.dmg "$GITHUB_WORKSPACE/out/Dominote.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      # Keep LF line endings so tests and bundled files match the Mac build.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: |
          node tests/md.test.js
          node tests/view.test.js
          cargo test

      - name: Build
        env:
          CI: true
        run: npx -y @tauri-apps/cli@2 build --bundles nsis

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe out/Dominote-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Dominote $GITHUB_REF_NAME" --generate-notes out/*
